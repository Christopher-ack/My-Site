<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>All Tasks — My Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Design system + page styles, then the nav bar, then this page. -->
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="site-nav.css">
<link rel="stylesheet" href="tasks.css">
</head>
<body>

<!-- The nav builds itself from site-nav.js. Same two lines on every page. -->
<div id="nav-mount"></div>

<div class="page page-wide">
  <header class="page-header">
    <h1>All Tasks</h1>
    <p class="tagline">Every task in one table.</p>
  </header>

  <div class="task-head">
    <div class="task-head-left">
      <span class="label-caps">All Tasks</span>
      <span class="count-label" id="count"></span>
    </div>
  </div>

  <!-- Filters. Both dropdowns are built from the file, so a status or a
       priority added there turns up here without touching this markup. -->
  <div class="filter-bar">
    <div class="filter-bar-left">
      <div class="popover-wrap">
        <button class="control-btn" type="button" id="statusBtn" aria-haspopup="true" aria-expanded="false">
          <span id="statusBtnLabel">Status</span><span class="chevron"></span>
        </button>
        <div class="dropdown" id="statusDrop"></div>
      </div>

      <div class="popover-wrap">
        <button class="control-btn" type="button" id="priBtn" aria-haspopup="true" aria-expanded="false">
          <span id="priBtnLabel">Priority</span><span class="chevron"></span>
        </button>
        <div class="dropdown" id="priDrop"></div>
      </div>

      <div class="search-control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="search" placeholder="Search title and description…" autocomplete="off" />
      </div>
    </div>

    <!-- Actions ride the same row as the filters, pinned to the right.
         Pill first, then the buttons, the same order as everywhere else. -->
    <div class="filter-bar-right">
      <!-- Dot is lit only when the page and the file agree. -->
      <div class="data-pill">
        <span class="dot" id="dataDot"></span>
        <span class="data-label" id="dataLabel">Loading…</span>
        <button class="fmt-btn" type="button" id="downloadBtn">Download</button>
      </div>
      <a class="btn btn-small btn-link" href="task-board.html">View board</a>
      <button class="btn-primary btn-small" type="button" id="addBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add task
      </button>
    </div>
  </div>

  <div class="card card-accent">
    <table class="task-table">
      <thead>
        <tr>
          <th style="width:40%">
            <button class="sort-header active" type="button" data-sort="title">Task<span class="sort-arrow"></span></button>
          </th>
          <th style="width:14%">
            <button class="sort-header" type="button" data-sort="status">Status<span class="sort-arrow"></span></button>
          </th>
          <th style="width:14%">
            <button class="sort-header" type="button" data-sort="priority">Priority<span class="sort-arrow"></span></button>
          </th>
          <th style="width:18%">
            <button class="sort-header" type="button" data-sort="due">Due<span class="sort-arrow"></span></button>
          </th>
          <th style="width:8%"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="empty-state" id="emptyState">
      <strong>Nothing to show</strong>
      <span>Clear the filters, or add your first task.</span>
    </div>
  </div>
</div>

<!-- One modal, reused by every row. Always opens in edit mode. -->
<div class="modal-overlay" id="overlay">
  <div class="modal-box task-modal" id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 class="modal-title" id="modalTitle">Add task</h2>

    <div class="field">
      <label class="modal-label" for="fTitle">Title</label>
      <input type="text" id="fTitle" class="input" placeholder="What needs done" autocomplete="off" />
    </div>

    <div class="field">
      <label class="modal-label" for="fDesc">Description</label>
      <textarea id="fDesc" class="input input-area" rows="3" placeholder="A line or two of context, shown on the card"></textarea>
    </div>

    <div class="field">
      <label class="modal-label" for="fDue">Due date</label>
      <div class="due-field">
        <input type="date" id="fDue" class="input input-date" />
        <button class="btn btn-small" type="button" id="clearDue">Clear</button>
      </div>
    </div>

    <div class="field">
      <label class="modal-label">Priority</label>
      <div class="cat-picker" id="fPriority"></div>
    </div>

    <div class="field">
      <label class="modal-label">Status</label>
      <div class="cat-picker" id="fStatus"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-danger" type="button" id="deleteBtn" hidden>Delete</button>
      <span class="modal-actions-spacer"></span>
      <button class="btn" type="button" id="cancelBtn">Cancel</button>
      <button class="btn-primary" type="button" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- One menu panel, positioned in JS, reused by every row. -->
<div class="menu-panel" id="rowMenu" role="menu" aria-label="Task actions">
  <button class="menu-item" type="button" role="menuitem" data-act="edit">Edit task</button>
  <div class="menu-divider"></div>
  <button class="menu-item menu-item-danger" type="button" role="menuitem" data-act="delete">Delete task</button>
</div>

<!-- Save status toast -->
<div class="toast" id="toast"><span class="toast-dot"></span><span id="toastText"></span></div>

<script src="site-nav.js"></script>
<script src="tasks-store.js"></script>
<script src="tasks-all.js"></script>
</body>
</html>
