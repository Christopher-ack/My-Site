<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Tasks — My Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Design system + page styles, then the nav bar, then this page. -->
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="site-nav.css">
<link rel="stylesheet" href="tasks.css">
</head>
<body>

<!-- The nav builds itself from site-nav.js. Same two lines on every page. -->
<div id="nav-mount"></div>

<div class="page">
  <header class="page-header">
    <h1>Tasks</h1>
    <p class="tagline">Tasks dashboard.</p>
  </header>

  <div class="task-head">
    <div class="task-head-left">
      <span class="label-caps">Overview</span>
      <span class="count-label" id="count"></span>
    </div>

    <div class="task-head-right">
      <!-- Dot is lit only when the page and the file agree. -->
      <div class="data-pill">
        <span class="dot" id="dataDot"></span>
        <span class="data-label" id="dataLabel">Loading…</span>
        <button class="fmt-btn" type="button" id="downloadBtn">Download</button>
      </div>
      <a class="btn-primary btn-small" href="task-board.html">Open the board</a>
    </div>
  </div>

  <!-- Four counts. Built from the file, so a new column shows up here
       without this page being touched. -->
  <div class="stat-row" id="stats"></div>

  <div class="task-dash">

    <!-- Anything late or landing inside a week, open columns only. -->
    <div class="card card-accent">
      <div class="tabs">
        <div class="tab-group" id="dashTabs" role="tablist">
          <button class="tab active" type="button" role="tab" data-tab="attention"
                  aria-selected="true">Needs a look</button>
          <button class="tab" type="button" role="tab" data-tab="high"
                  aria-selected="false">High priority</button>
        </div>
        <span class="count-label" id="attentionCount"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:52%"><span class="header-label">Task</span></th>
            <th style="width:24%" class="col-hide-sm"><span class="header-label">Status</span></th>
            <th style="width:24%"><span class="header-label">Due</span></th>
          </tr>
        </thead>
        <tbody id="attentionRows"></tbody>
      </table>

      <div class="empty-state" id="attentionEmpty">
        <strong>Nothing is late</strong>
        <span>Nothing open is due inside the next week either.</span>
      </div>
    </div>

    <!-- Where the work is sitting. -->
    <div class="card card-pad">
      <span class="label-caps">By Status</span>
      <div class="split-list" id="split"></div>
      <p class="dash-note">
        All open and pending tasks. Closed and Complete for the last 30 days.
      </p>
    </div>

  </div>
</div>

<!-- Save status toast -->
<div class="toast" id="toast"><span class="toast-dot"></span><span id="toastText"></span></div>

<script src="site-nav.js"></script>
<script src="tasks-store.js"></script>
<script src="tasks.js"></script>
</body>
</html>
